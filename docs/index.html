<script>

function getP(k) { if (!S.periods[k]) S.periods[k] = { ov:{}, extra:[], moves:[], revealed:false, done:null }; return S.periods[k]; }

/* ---------- Règles automatiques : elles ne comptent qu'à partir de leur mois de départ ---------- */
const ruleFrom = r => r.versions[0].from;
const ruleActive = (r, k) => ruleFrom(r) <= k && (!r.to || k <= r.to);
const ruleAmount = (r, k) => { let a = r.versions[0].amount; for (const v of r.versions) if (v.from <= k) a = v.amount; return a; };
const first = () => S.settings.startKey;                       // premier mois « en direct » : la tirelire démarre ici
const isHist = k => k < first();                               // mois d'avant le début : pour mémoire, sans effet sur la tirelire
const minDate = () => shiftKey(first(), -MAX_BACK) + '-16';
function minKey() {
  let m = first(); const upd = k => { if (k < m) m = k; };
  S.payments.forEach(p => upd(periodOf(p.date))); S.oneoffs.forEach(e => upd(periodOf(e.date)));
  [...S.rules.inc, ...S.rules.exp].forEach(r => upd(ruleFrom(r)));
  Object.keys(S.periods).forEach(k => { const P = S.periods[k]; if (P.done || P.moves.length) upd(k); });
  return m;
}

function liveLines(k) {
  const P = getP(k), inc = [], exp = [];
  const take = (rules, out, withCat) => rules.forEach(r => {
    if (!ruleActive(r, k)) return;
    const o = P.ov[r.id] || {};
    if (o.removed) return;
    const line = { id:r.id, rule:true, name:r.name, amount:(o.amount != null ? o.amount : ruleAmount(r, k)) };
    if (withCat) line.cat = r.cat;
    out.push(line);
  });
  take(S.rules.inc, inc, false);
  take(S.rules.exp, exp, true);
  S.oneoffs.filter(e => periodOf(e.date) === k).sort((a, b) => (a.date < b.date ? 1 : -1))
    .forEach(e => exp.push({ id:e.id, rule:false, name:e.name, amount:e.amount, cat:e.cat, date:e.date }));
  const pays = S.payments.filter(p => periodOf(p.date) === k).sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
  return { pays, inc, exp };
}
const lines = k => { const P = getP(k); return P.done ? P.done.snap : liveLines(k); };
function calc(k) {
  const L = lines(k), min = S.settings.min;
  const pay = sum(L.pays), fixed = sum(L.inc), inc = r2(pay + fixed), dep = sum(L.exp);
  const reste = r2(inc - dep);

}
const movedOf = P => r2(P.moves.reduce((a, m) => a + m.amount, 0));
const balance = () => r2(S.settings.start + r2(Object.values(S.periods).reduce((a, P) => a + movedOf(P), 0)));
function tirelireModel(k) {   // ce que le mois demande à la tirelire, ce qui y est déjà passé, et ce qu'il reste à faire
  const c = calc(k), P = getP(k);

}
const ended = k => periodOf(todayStr()) > k;
const curKey = () => { const k = periodOf(todayStr()); return k < first() ? first() : k; };
const prevDone = k => k <= first() || !!getP(shiftKey(k, -1)).done;
const canClose = k => !isHist(k) && ended(k) && prevDone(k);

/* ---------- Écran « Ce mois-ci » ---------- */
function heroHtml(k) {
  const { c, P, target, moved, rem } = tirelireModel(k);
  const hist = isHist(k), isEnd = ended(k);
  const pct = x => Math.max(0, Math.min(100, Math.round(x * 100)));
  const f1 = c.dep > 0 ? Math.min(1, c.inc / c.dep) : (c.inc > 0 ? 1 : 0);
  const f2 = c.libre > 0 ? Math.min(1, Math.max(0, (c.inc - c.dep) / c.libre)) : (c.inc > c.dep ? 1 : 0);
  const f3 = c.save > 0 ? 1 : 0;
  const bal = balance();
  const blockTip = !prevDone(k) ? '<p class="tip">Valide d’abord le mois précédent pour pouvoir clôturer celui-ci.</p>' : '';
  const balWarn = need => (S.settings.set
    ? (need > bal + 0.004 ? `<p class="warn">La tirelire ne contient que ${fmt(Math.max(0, bal))}. Il manquera ${fmt(need - Math.max(0, bal))}.</p>` : '')
    : '<p class="tip">Dis-moi combien il y a sur ta tirelire (onglet « Ma tirelire ») et je vérifie qu’elle suffit.</p>');
  let mood = 'calm', bubble = '', extra = '', actions = '';

  // ce que la tirelire doit recevoir ou rendre, et le bouton pour le noter
  const moveUi = final => {
    let ex = '', ac = '';
    if (target >= 0 && (moved !== 0 || rem > 0)) ex += `<div class="mvbox"><div class="mvrow"><span>Déjà mis de côté</span><b>${fmt(Math.max(0, moved))}</b></div><div class="mvrow"><span>Reste à mettre de côté</span><b>${fmt(Math.max(0, rem))}</b></div></div>`;
    if (rem > 0) ac = `<button class="btn-main" data-act="move">J’ai mis ${fmt(rem)} de côté</button>`;
    else if (rem < 0 && (final || moved > 0)) {
      if (target >= 0) { ex += `<p class="warn">Tu as mis ${fmt(-rem)} de trop dans ta tirelire (les chiffres ont changé).</p>`; ac = `<button class="btn-main" data-act="move">J’ai remis ${fmt(-rem)} sur mon compte</button>`; }
      else { if (moved > 0) ex += `<p class="tip">Tu avais mis ${fmt(moved)} de côté plus tôt : je te propose de le reprendre en même temps.</p>`; ex += balWarn(-rem); ac = `<button class="btn-main" data-act="move">J’ai pris ${fmt(-rem)} dans ma tirelire</button>`; }
    } else if (rem === 0 && final) ac = blockTip || '<button class="btn-main" data-act="validate">Valider ce mois</button>';
    if (P.moves.length) ac += '<button class="link" data-act="undo-move">Annuler le dernier mouvement</button>';
    return { ex, ac };
  };

  if (hist) {
    bubble = 'Ce mois est avant ton début. Je le garde pour mémoire.';
    extra = '<p class="tip">Il ne change pas ta tirelire.</p>';
  } else if (P.done) {
    mood = moved > 0 ? 'happy' : 'calm';
    bubble = moved < 0 ? `Tu as pris ${fmt(-moved)} dans ta tirelire.` : moved > 0 ? `Tu as mis ${fmt(moved)} de côté. Bravo !` : 'Mois validé : pile ce qu’il fallait.';
    actions = `<div class="okrow"><span class="ok">${ico('check', 20, 3)} Noté dans ta tirelire</span>${canUndo(k) ? '<button class="link" data-act="undo">Annuler</button>' : ''}</div>`;
  } else if (isEnd && !P.revealed) {
    bubble = 'Le mois est terminé. On fait le calcul ?';
    actions = blockTip || '<button class="btn-main" data-act="reveal">Le mois est terminé, calculer</button>';
  } else if (isEnd) {
    let sub;
    if (rem === 0 && moved > 0 && target > 0) { mood = 'happy'; bubble = `Déjà ${fmt(moved)} dans ta tirelire. Bravo !`; sub = `Il te reste ${fmt(c.libre)} libres pour toi.`; }
    else if (target < 0) {
      bubble = `Prends ${fmt(c.pioche)} dans ta tirelire`;
      sub = c.reste < 0 ? `Les dépenses dépassent tes revenus de ${fmt(-c.reste)}. La tirelire couvre ça et te redonne tes ${fmt(c.libre)} libres.`
                        : `Après tes dépenses, il te reste ${fmt(c.reste)}. La tirelire complète pour que tu aies tes ${fmt(c.libre)} libres.`;
    } else if (target > 0) { mood = 'happy'; bubble = `Mets ${fmt(c.save)} de côté`; sub = `Dans ta tirelire (livret A). Il te reste ${fmt(c.libre)} libres pour toi.`; }
    else { bubble = 'Pile ce qu’il faut'; sub = `Rien à mettre de côté, rien à prendre. Tes ${fmt(c.libre)} sont là.`; }
    const u = moveUi(true); extra = `<p class="sub">${esc(sub)}</p>${u.ex}`; actions = u.ac;
  } else {
    if (c.pay === 0) { mood = 'sleep'; bubble = 'Rien reçu pour l’instant. Ajoute ton premier paiement dès qu’il arrive.'; }
    else if (c.inc < c.dep) bubble = `Encore ${fmt(c.dep - c.inc)} et tes dépenses sont couvertes.`;
    else if (c.inc < c.dep + c.libre) { mood = 'happy'; bubble = `Dépenses couvertes ! Encore ${fmt(c.dep + c.libre - c.inc)} pour tes ${fmt(c.libre)} libres.`; }
    else { mood = 'happy'; bubble = rem > 0 ? `Tout est couvert. ${fmt(rem)} à mettre dans la tirelire.` : moved > 0 ? `Tout est couvert, et ${fmt(moved)} sont déjà dans ta tirelire.` : 'Tout est couvert.'; }
    const u = moveUi(false); extra = u.ex; actions = u.ac;
  }

  return `<section class="card" aria-live="polite">
    <div class="hrow">${pig(mood)}<div class="bubble">${esc(bubble)}</div></div>
    <div><div class="gauge" role="img" aria-label="Avancement du mois">
      <div class="seg" style="flex:6"><i style="width:${pct(f1)}%"></i></div>
      <div class="seg" style="flex:2"><i style="width:${pct(f2)}%"></i></div>
      <div class="seg" style="flex:2"><i style="width:${pct(f3)}%"></i></div></div>
      <div class="glab"><div style="flex:6">Dépenses couvertes</div><div style="flex:2;text-align:center">${fmt(c.libre)} pour moi</div><div style="flex:2;text-align:right">Tirelire</div></div></div>
    <p class="meta">Reçu ${fmt(c.inc)} pour ${fmt(c.dep)} de dépenses.</p>
    ${extra}${actions}</section>`;
}

function monthView() {
  const k = vk;
  const last = Object.values(S.periods).reduce((a, P) => Math.max(a, P.done ? P.done.at : 0, ...P.moves.map(m => m.at || 0)), 0);
  const needBackup = last > (S.settings.lastBackup || 0);
  let pending = null;
  for (let q = first(); q < curKey(); q = shiftKey(q, 1)) { if (!getP(q).done) { pending = q; break; } }
  return `${pending && pending !== k ? `<div class="note">${cap(mName(pending))} est terminé, tu peux faire le calcul. <button class="link" data-act="goto" data-key="${pending}">Voir ${mName(pending)}</button></div>` : ''}
    ${!storageOK ? '<p class="note">Aperçu : tes saisies ne sont pas gardées ici. Dans l’app installée, elles le sont.</p>' : ''}
    ${needBackup ? '<div class="note">Pense à faire ta sauvegarde, c’est ce qui protège tes chiffres si le téléphone change. <button class="link" data-act="backup">Sauvegarder</button></div>' : ''}
    <div class="mbar">
      <button class="rb" data-act="prev" aria-label="Mois précédent" aria-disabled="${k <= minKey()}">${ico('left', 22, 3)}</button>
      <div class="mt"><b>${cap(mName(k))} ${k.split('-')[0]}${isHist(k) ? '<span class="badge">historique</span>' : ''}</b><small>${rangeTxt(k)}</small></div>
      <button class="rb" data-act="next" aria-label="Mois suivant" aria-disabled="${k >= curKey()}">${ico('right', 22, 3)}</button>
    </div>
    ${heroHtml(k)}${rentreesHtml(k)}${depensesHtml(k)}`;
}

/* ---------- Écran « Ma tirelire » ---------- */
function jarView() {
  const bal = balance(), goal = Math.max(1, S.settings.goal);
  const lvl = bal <= 0 ? 0 : Math.min(1, Math.max(0.05, bal / goal));
  const pct = Math.max(0, Math.min(100, Math.round(bal / goal * 100)));
  const rows = Object.entries(S.periods).filter(([k, P]) => !isHist(k) && (P.done || P.moves.length)).sort((a, b) => (a[0] < b[0] ? 1 : -1));
  const taken = rows.filter(([, P]) => P.done && movedOf(P) < 0);
  const avg = taken.length ? r2(taken.reduce((a, [, P]) => a - movedOf(P), 0) / taken.length) : 0;
  const cover = avg > 0 && bal > 0 ? Math.floor(bal / avg) : null;
  return `<h1 class="page-title">Ma tirelire</h1>
    <p class="lead">C’est ton livret A : il se remplit les bons mois et dépanne les mois justes.</p>
    <section class="card"><div class="jarbox">${jarSvg(lvl)}<div>
      <div class="bal-l">Dans la tirelire</div><div class="bal${bal < 0 ? ' neg' : ''}">${fmt(bal)}</div>
      <div class="bar" role="img" aria-label="${pct} % de l’objectif"><i style="width:${pct}%"></i></div>
      <div class="meta">Objectif : ${fmt(goal)} (${pct} %)</div></div></div>
      ${cover != null ? `<p class="tip">Les mois justes te coûtent en moyenne ${fmt(avg)}. À ce rythme, la tirelire tient ${cover} mois.</p>` : ''}
      <button class="btn-main" data-act="fix-balance">${S.settings.set ? 'Corriger mon solde' : 'Dire combien il y a sur mon livret A'}</button></section>
    <section class="card"><div class="sec-h"><h2>Mouvements par mois</h2></div>
      <div>${rows.length ? rows.map(([k, P]) => { const d = movedOf(P); return `<div class="hrow2"><div class="nm"><b>${cap(mName(k))} ${k.split('-')[0]}${P.done ? '' : '<span class="badge">en cours</span>'}</b><small>${rangeTxt(k)}</small></div><b class="am ${d >= 0 ? 'plus' : 'minus'}">${d >= 0 ? '+' : '−'}${fmt(Math.abs(d))}</b></div>`; }).join('')
        : '<p class="empty">Rien pour l’instant. Quand tu notes un dépôt ou un retrait, il apparaît ici et la tirelire se met à jour toute seule.</p>'}</div></section>`;
}

      <div class="setline"><label for="s-goal">Objectif de la tirelire<small>Pour voir où tu en es.</small></label><input class="nin" id="s-goal" inputmode="decimal" data-setting="goal" value="${toField(S.settings.goal)}"></div></section>

/* ---------- Fenêtres du bas ---------- */
function closeSheet() { const s = $('.sheet-wrap'); if (s) s.remove(); ps = null; }
function openSheet(title, body, noFocus) {
  closeSheet();
  const el = document.createElement('div');
  el.className = 'sheet-wrap';
  el.innerHTML = `<div class="scrim" data-act="close-sheet"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab"></div><h2>${esc(title)}</h2>${body}</div>`;
  document.body.appendChild(el);
  const f = noFocus ? null : el.querySelector('input:not([type=checkbox]):not([type=date]):not([readonly])'); if (f) f.focus();

}
let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2400); }
function burst() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols = ['#FFD84D', '#35C9A8', '#FF8FA3', '#FF9F43', '#B8A8FF'];
  for (let i = 0; i < 18; i++) {
    const s = document.createElement('span'); s.className = 'pop';
    s.style.setProperty('--c', cols[i % cols.length]);
    s.style.setProperty('--dx', (Math.random() * 320 - 160) + 'px');
    s.style.setProperty('--dy', -(120 + Math.random() * 220) + 'px');
    document.body.appendChild(s); s.addEventListener('animationend', () => s.remove());
  }
}
const arm = (btn, label) => { if (btn.dataset.armed) return true; btn.dataset.armed = '1'; btn.textContent = label; return false; };
const catChips = cat => `<div class="chips" role="group" aria-label="Catégorie">${Object.entries(CATS).map(([key, v]) => `<button class="chip" data-act="cat" data-cat="${key}" aria-pressed="${key === cat}">${v.label}</button>`).join('')}</div>`;

// Un paiement ou une dépense datée va dans la période qui contient sa date. Le passé est permis, pas le futur.
function dateHint(dateStr, what) {
  if (!dateStr) return { ok:false, text:'Choisis une date.' };
  if (dateStr > todayStr()) return { ok:false, text:'Cette date est dans le futur.' };
  if (dateStr < minDate()) return { ok:false, text:`Cette date est trop ancienne (jusqu’à ${MAX_BACK} mois avant ton début).` };
  const kk = periodOf(dateStr);
  if (getP(kk).done) return { ok:false, text:`${cap(mName(kk))} est déjà validé. Annule sa validation pour y ajouter ${what}.` };
  return { ok:true, text:`${cap(what)} ira dans ${cap(mName(kk))} (${rangeTxt(kk)})${isHist(kk) ? ', avant ton début : pour mémoire seulement' : ''}.` };
}
const payHint = d => { const h = dateHint(d, 'ce paiement'); if (h.ok) h.text = h.text.replace(/^Ce paiement/, 'Ce paiement'); return h; };
function monthOptions(sel) {
  const hi = curKey(), lo = shiftKey(first(), -MAX_BACK), out = [];
  for (let q = hi; q >= lo; q = shiftKey(q, -1)) out.push(`<option value="${q}"${q === sel ? ' selected' : ''}>${cap(mName(q))} ${q.split('-')[0]}${q === hi ? ' (ce mois-ci)' : ''}</option>`);
  if (sel < lo) out.push(`<option value="${sel}" selected>${cap(mName(sel))} ${sel.split('-')[0]}</option>`);
  return out.join('');
}
function bindDateHint(el, what) {
  const upd = () => { const h = dateHint($('#f-date', el).value, what); const x = $('#f-hint', el); x.textContent = h.text; x.style.color = h.ok ? '' : 'var(--minus)'; };
  $('#f-date', el).addEventListener('input', upd); $('#f-date', el).addEventListener('change', upd); upd();
}

  const oth = ps.sel === 'other';

  const add = ps.adding

  return `${list.length ? `<div class="clist" role="group" aria-label="Mes clients">${tiles}</div>` : ''}<div class="cspecial">${other}${add}</div>${otherField}`;
}
const refreshClients = () => { const a = $('#cl-area'); if (a) a.innerHTML = clientAreaHtml(); };
function payForm(p) {
  return `<div class="fld-l">Qui t’a payée ?</div><div id="cl-area">${clientAreaHtml()}</div>
    <label class="fld">Montant reçu<input id="f-amt" inputmode="decimal" autocomplete="off" placeholder="0" value="${p ? toField(p.amount) : ''}"></label>
    <label class="fld">Date de réception<input type="date" id="f-date" value="${p ? p.date : todayStr()}" max="${todayStr()}" min="${minDate()}"></label>
    <p class="hint" id="f-hint"></p><p class="err" id="f-err"></p>`;
}
function openPay(p, pre) {
  const st = { sel:null, other:'', confirm:null, adding:false };
  ps = st;
  if (p) { const c = p.clientId && S.clients.find(x => x.id === p.clientId); if (c) st.sel = c.id; else { st.sel = 'other'; st.other = p.name || ''; } }
  else if (pre && pre.sel && S.clients.find(x => x.id === pre.sel)) st.sel = pre.sel;

  ps = st;   // openSheet remet l'état à zéro en fermant l'éventuelle fenêtre précédente : on le rétablit

}

function freqAreaHtml(freq, selFrom) {
  return freq === 'once'

function openAddExp(isInc) {

function openExp(id, isRule, isInc) {

  if (isRule) {

    ${isRule ? `<div class="fld">Ce montant compte pour<div class="chips"><button class="chip" data-act="scope" data-scope="this" aria-pressed="true">Ce mois-ci seulement</button><button class="chip" data-act="scope" data-scope="future" aria-pressed="false">Ce mois-ci et les suivants</button></div></div>

function backupSheet() {
  openSheet('Sauvegarde', `<p>Copie ce texte ou enregistre-le dans un fichier, puis garde-le (message à toi-même, Drive). Il permet de tout retrouver si le téléphone change.</p>

    <button class="btn-main" data-act="copy">Copier le texte</button>

    ${navigator.share ? '<button class="btn-ghost" data-act="share">Envoyer…</button>' : ''}
    <label class="fld">Pour restaurer, colle une sauvegarde ici<textarea id="bk-in" placeholder="Colle le texte ici"></textarea></label>
    <p class="err" id="f-err"></p><button class="btn-ghost" data-act="import">Restaurer</button>`);
}
const markBackup = () => { S.settings.lastBackup = Date.now(); persist(); };

/* ---------- Actions ---------- */
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id, wrap = b.closest('.sheet-wrap');
  const k = vk, P = () => getP(vk);
  const err = t => { const x = $('#f-err', wrap); if (x) x.textContent = t; };

  switch (act) {
    case 'tab': view = b.dataset.tab; render(); window.scrollTo(0, 0); break;
    case 'prev': if (vk > minKey()) { vk = shiftKey(vk, -1); render(); } break;
    case 'next': if (vk < curKey()) { vk = shiftKey(vk, 1); render(); } break;
    case 'close-sheet': closeSheet(); break;
    case 'goto': vk = b.dataset.key; render(); window.scrollTo(0, 0); break;
    case 'locked': toast('Ce mois est validé. Annule la validation pour le modifier.'); break;
    case 'reveal': P().revealed = true; persist(); render(); break;

    // tirelire : chaque dépôt ou retrait réel est noté ici
    case 'move': {
      const m = tirelireModel(k); if (isHist(k) || m.P.done || m.rem === 0) break;
      m.P.moves.push({ id:uid(), amount:m.rem, at:Date.now() });
      if (ended(k) && m.P.revealed && canClose(k)) m.P.done = { at:Date.now(), snap:clone(liveLines(k)) };
      persist(); render(); toast('Noté dans ta tirelire'); if (m.rem > 0) burst();
      break;
    }
    case 'undo-move': if (P().moves.length && !P().done) { P().moves.pop(); persist(); render(); toast('Dernier mouvement annulé'); } break;
    case 'validate': {
      const m = tirelireModel(k); if (!canClose(k) || m.rem !== 0 || m.P.done) break;
      m.P.done = { at:Date.now(), snap:clone(liveLines(k)) };
      persist(); render(); toast('Mois validé');
      break;
    }
    case 'undo': if (canUndo(k)) { P().done = null; persist(); render(); toast('Validation annulée'); } break;

    // première ouverture
    case 'start': {
      const bal = parseAmount(($('#w-bal') || {}).value);
      S.settings.startKey = periodOf(todayStr()); S.settings.started = true;
      if (bal != null && ($('#w-bal').value || '').trim() !== '') { S.settings.start = bal; S.settings.set = true; }
      persist(); view = 'month'; vk = curKey(); render();
      break;
    }
    case 'config-open':
      openSheet('Configuration de départ', `<p>Colle ici le texte de configuration qu’on t’a donné. Il remplit tes dépenses et tes clients.</p>
        <label class="fld">Texte de configuration<textarea id="bk-in" placeholder="Colle le texte ici"></textarea></label>
        <p class="err" id="f-err"></p><button class="btn-main" data-act="config-apply">Appliquer</button>`);
      break;
    case 'config-apply': {
      let c = null; try { c = JSON.parse($('#bk-in', wrap).value.trim()); } catch (x) {}
      if (!c || c.config !== true) { err('Ce texte n’est pas une configuration valide.'); break; }
      const bal0 = parseAmount(($('#w-bal') || {}).value);   // solde du livret A éventuellement déjà tapé sur l'écran de bienvenue
      S = applyConfig(c);
      if (bal0 != null && ($('#w-bal').value || '').trim() !== '') { S.settings.start = bal0; S.settings.set = true; }
      persist(); closeSheet(); view = 'month'; vk = curKey(); render(); toast('Configuration appliquée');
      break;
    }

    // paiements et clients
    case 'add-pay': openPay(null, b.dataset.client ? { sel:b.dataset.client } : null); break;
    case 'edit-pay': { const p = S.payments.find(x => x.id === id); if (p) openPay(p); break; }
    case 'toggle-clients': clientsOpen = !clientsOpen; render(); break;
    case 'sel-client': ps.sel = id; ps.adding = false; ps.confirm = null; refreshClients(); $('#f-amt', wrap).focus(); break;
    case 'sel-other': ps.sel = 'other'; ps.adding = false; ps.confirm = null; refreshClients(); { const f = $('#f-other', wrap); if (f) f.focus(); } break;
    case 'cl-del': ps.confirm = id; refreshClients(); break;
    case 'cl-del-no': ps.confirm = null; refreshClients(); break;
    case 'cl-del-yes': { const gone = ps.confirm; deleteClient(gone); if (ps.sel === gone) ps.sel = null; ps.confirm = null; refreshClients(); toast('Client supprimé'); break; }
    case 'cl-add-open': ps.adding = true; ps.confirm = null; refreshClients(); { const f = $('#f-newcl', wrap); if (f) f.focus(); } break;
    case 'cl-add-cancel': ps.adding = false; refreshClients(); break;
    case 'cl-add-save': {
      const r = addClient($('#f-newcl', wrap).value);
      if (!r.ok) { $('#f-newerr', wrap).textContent = r.error; break; }
      ps.sel = r.client.id; ps.adding = false; refreshClients();
      toast(r.existing ? 'Ce client existait déjà, je l’ai sélectionné' : 'Client ajouté'); $('#f-amt', wrap).focus();
      break;
    }
    case 'pay-save': {
      const amount = parseAmount($('#f-amt', wrap).value), date = $('#f-date', wrap).value;
      if (!ps.sel) { err('Choisis qui t’a payée, ou « Autre chose ».'); break; }
      let name, clientId = null;
      if (ps.sel === 'other') { name = (ps.other || '').trim(); if (!name) { err('Précise le nom.'); break; } }
      else { const c = S.clients.find(x => x.id === ps.sel); if (!c) { err('Choisis qui t’a payée.'); break; } name = c.name; clientId = c.id; }
      if (!amount) { err('Écris un montant, par exemple 85 ou 85,50.'); break; }
      const h = dateHint(date, 'ce paiement'); if (!h.ok) { err(h.text); break; }
      const editId = wrap.dataset.id;
      if (editId) {
        const p = S.payments.find(x => x.id === editId); if (!p) break;
        if (getP(periodOf(p.date)).done) { err('Le mois de ce paiement est validé. Annule la validation pour le modifier.'); break; }
        Object.assign(p, { amount, name, date, clientId });
      } else S.payments.push({ id:uid(), clientId, name, amount, date });
      const target = periodOf(date), moved = target !== vk; vk = target;
      persist(); closeSheet(); render();
      toast(moved ? `Rangé dans ${cap(mName(target))}` : editId ? 'Paiement modifié' : 'Paiement ajouté');
      break;
    }
    case 'pay-del': {
      if (!arm(b, 'Oui, supprimer')) break;
      const p = S.payments.find(x => x.id === wrap.dataset.id);
      if (p && getP(periodOf(p.date)).done) { err('Le mois de ce paiement est validé. Annule la validation pour le modifier.'); break; }
      S.payments = S.payments.filter(x => x.id !== wrap.dataset.id);
      persist(); closeSheet(); render(); toast('Paiement supprimé');
      break;
    }

    // dépenses et revenus fixes
    case 'add-exp': openAddExp(!!b.dataset.inc); break;
    case 'edit-exp': openExp(id, b.dataset.rule === '1', false); break;
    case 'edit-rule': openExp(id, true, true); break;
    case 'cat': wrap.dataset.cat = b.dataset.cat; wrap.querySelectorAll('[data-act=cat]').forEach(c => c.setAttribute('aria-pressed', String(c === b))); break;
    case 'scope': wrap.dataset.scope = b.dataset.scope; wrap.querySelectorAll('[data-act=scope]').forEach(c => c.setAttribute('aria-pressed', String(c === b))); break;
    case 'freq':
      wrap.dataset.freq = b.dataset.freq;
      wrap.querySelectorAll('[data-act=freq]').forEach(c => c.setAttribute('aria-pressed', String(c === b)));
      $('#freq-area', wrap).innerHTML = freqAreaHtml(b.dataset.freq, vk);
      if (b.dataset.freq === 'once') bindDateHint(wrap, 'cette dépense');
      break;
    case 'exp-add': {
      const name = cleanName($('#f-name', wrap).value), amount = parseAmount($('#f-amt', wrap).value) ?? 0, isInc = !!wrap.dataset.inc;
      if (!name) { err('Donne un nom à cette ligne.'); break; }
      const freq = isInc ? 'rule' : wrap.dataset.freq;
      if (freq === 'rule') {
        const from = $('#f-from', wrap).value;
        (isInc ? S.rules.inc : S.rules.exp).push({ id:uid(), name, cat:wrap.dataset.cat, versions:[{ from, amount }], to:null });
      } else {
        const date = $('#f-date', wrap).value, h = dateHint(date, 'cette dépense'); if (!h.ok) { err(h.text); break; }
        S.oneoffs.push({ id:uid(), name, amount, cat:wrap.dataset.cat, date }); vk = periodOf(date);
      }
      persist(); closeSheet(); render(); toast('Ajouté');
      break;
    }
    case 'exp-save': {
      const name = cleanName($('#f-name', wrap).value), amount = parseAmount($('#f-amt', wrap).value);
      if (!name) { err('Donne un nom à cette ligne.'); break; }
      if (amount == null) { err('Écris un montant, par exemple 58 ou 58,50.'); break; }
      const isRule = !!wrap.dataset.rule, isInc = !!wrap.dataset.inc, cat = wrap.dataset.cat, scope = wrap.dataset.scope;
      if (isRule) {
        const r = (isInc ? S.rules.inc : S.rules.exp).find(x => x.id === wrap.dataset.id); if (!r) break;
        const newFrom = $('#f-from', wrap).value, oldFrom = ruleFrom(r);
        if (newFrom !== oldFrom) {
          if (newFrom > k) { err('Le début ne peut pas être après le mois affiché.'); break; }
          if (r.to && newFrom > r.to) { err('Le début doit être avant la fin de cette ligne.'); break; }
          if (newFrom < oldFrom) r.versions[0].from = newFrom;
          else { const at = ruleAmount(r, newFrom); r.versions = r.versions.filter(v => v.from > newFrom); r.versions.unshift({ from:newFrom, amount:at }); }
        }
        r.name = name; if (!isInc) r.cat = cat;
        const o = P().ov[r.id] || (P().ov[r.id] = {});
        if (scope === 'future') {
          r.versions = r.versions.filter(v => v.from < k); r.versions.push({ from:k, amount }); r.versions.sort((a, c) => (a.from < c.from ? -1 : 1));
          delete o.amount;
        } else if (amount === ruleAmount(r, k)) delete o.amount; else o.amount = amount;
      } else {
        const x = S.oneoffs.find(q => q.id === wrap.dataset.id); if (!x) break;
        const date = $('#f-date', wrap).value, h = dateHint(date, 'cette dépense'); if (!h.ok) { err(h.text); break; }
        Object.assign(x, { name, amount, cat, date }); vk = periodOf(date);
      }
      persist(); closeSheet(); render(); toast('Enregistré');
      break;
    }
    case 'exp-remove': {
      const o = P().ov[wrap.dataset.id] || (P().ov[wrap.dataset.id] = {}); o.removed = true;
      persist(); closeSheet(); render(); toast('Retiré de ce mois-ci');
      break;
    }
    case 'exp-stop': {
      if (!arm(b, 'Oui, arrêter à partir de ce mois')) break;
      const isInc = !!wrap.dataset.inc, list = isInc ? S.rules.inc : S.rules.exp, r = list.find(x => x.id === wrap.dataset.id); if (!r) break;
      const last = shiftKey(k, -1);
      if (last < ruleFrom(r)) list.splice(list.indexOf(r), 1); else r.to = last;
      persist(); closeSheet(); render(); toast('Arrêté, le passé reste inchangé');
      break;
    }
    case 'exp-del': {
      if (!arm(b, 'Oui, supprimer')) break;
      S.oneoffs = S.oneoffs.filter(x => x.id !== wrap.dataset.id);
      persist(); closeSheet(); render(); toast('Dépense supprimée');
      break;
    }

    // solde, sauvegarde, réglages
    case 'fix-balance':
      openSheet('Combien y a-t-il sur ton livret A ?', `<p>Regarde ton solde dans ton appli bancaire et écris-le ici. Ensuite la tirelire se met à jour toute seule à chaque dépôt ou retrait que tu notes.</p>
        <label class="fld">Solde aujourd’hui<input id="f-bal" inputmode="decimal" autocomplete="off" value="${toField(balance())}"></label>
        <p class="err" id="f-err"></p><button class="btn-main" data-act="bal-save">Enregistrer</button>`);
      break;
    case 'bal-save': {
      const t = parseAmount($('#f-bal', wrap).value);
      if (t == null) { err('Écris un montant, par exemple 850 ou 850,50.'); break; }
      S.settings.start = r2(t - r2(Object.values(S.periods).reduce((a, q) => a + movedOf(q), 0))); S.settings.set = true;
      persist(); closeSheet(); render(); toast('Solde enregistré');
      break;
    }
    case 'rename-client': {
      const c = S.clients.find(x => x.id === id); if (!c) break;
      openSheet('Changer le nom', `<label class="fld">Nom du client<input type="text" id="f-name" maxlength="40" autocomplete="off" value="${esc(c.name)}"></label><p class="err" id="f-err"></p><button class="btn-main" data-act="client-rename-go" data-id="${id}">Enregistrer</button>`);
      break;
    }
    case 'client-rename-go': { const r = renameClient(id, $('#f-name', wrap).value); if (!r.ok) { err(r.error); break; } closeSheet(); render(); toast('Nom modifié'); break; }
    case 'client-del-ask': {
      const c = S.clients.find(x => x.id === id); if (!c) break;
      openSheet('Supprimer ce client ?', `<p><b>Êtes-vous sûr de supprimer «\u00a0${esc(c.name)}\u00a0»\u00a0?</b></p><p class="hint">Ses anciens paiements restent dans l’historique.</p><button class="btn-danger" data-act="client-del-go" data-id="${id}">Oui, supprimer</button><button class="btn-ghost" data-act="close-sheet">Non, je garde</button>`);
      break;
    }
    case 'client-del-go': deleteClient(id); closeSheet(); render(); toast('Client supprimé'); break;
    case 'client-add-set':
      openSheet('Ajouter un client', '<label class="fld">Nom du client<input type="text" id="f-name" maxlength="40" autocomplete="off" placeholder="Nom du client"></label><p class="err" id="f-err"></p><button class="btn-main" data-act="client-add-go">Ajouter</button>');
      break;
    case 'client-add-go': { const r = addClient($('#f-name', wrap).value); if (!r.ok) { err(r.error); break; } closeSheet(); render(); toast(r.existing ? 'Ce client existe déjà' : 'Client ajouté'); break; }
    case 'backup': backupSheet(); break;
    case 'copy': {
      const ta = $('#bk', wrap), text = ta.value, ok = () => { markBackup(); toast('Copié'); };
      const fb = () => { ta.select(); try { document.execCommand('copy'); ok(); } catch (x) { toast('Sélectionne le texte et copie-le'); } };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fb); else fb();
      break;
    }
    case 'dl': {
      try {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([$('#bk', wrap).value], { type:'text/plain' }));
        a.download = 'ma-tirelire-sauvegarde-' + todayStr() + '.txt'; document.body.appendChild(a); a.click(); a.remove();
        markBackup(); toast('Fichier enregistré');
      } catch (x) { toast('Impossible d’enregistrer ici. Utilise « Copier le texte ».'); }
      break;
    }
    case 'share': navigator.share({ title:'Sauvegarde Ma tirelire', text:$('#bk', wrap).value }).then(markBackup).catch(() => {}); break;
    case 'import': {
      let d = null; try { d = JSON.parse($('#bk-in', wrap).value.trim()); } catch (x) {}
      if (d && d.config === true) { if (!arm(b, 'Oui, remplacer mes données')) break; S = applyConfig(d); persist(); closeSheet(); view = 'month'; vk = curKey(); render(); toast('Configuration appliquée'); break; }
      d = d && migrate(d);
      if (!validShape(d)) { err('Ce texte n’est pas une sauvegarde valide.'); break; }
      if (!arm(b, 'Oui, remplacer mes données')) break;
      d.settings = Object.assign(emptyData().settings, d.settings);
      S = d; persist(); closeSheet(); view = 'month'; vk = curKey(); render(); toast('Données restaurées');
      break;
    }
    case 'reset':
      openSheet('Tout effacer ?', '<p>Tous tes mois, ta tirelire et tes réglages seront supprimés de ce téléphone. Pense à faire une sauvegarde avant.</p><button class="btn-danger" data-act="reset-go">Oui, tout effacer</button><button class="btn-ghost" data-act="close-sheet">Non, je garde tout</button>');
      break;
    case 'reset-go': S = DEMO ? demoData() : emptyData(); persist(); closeSheet(); view = 'month'; vk = curKey(); render(); toast('Tout est effacé'); break;
    
  }
});

document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.matches('[data-setting]')) { S.settings[t.dataset.setting] = parseAmount(t.value) ?? 0; persist(); }
  else if (t.id === 'f-other' && ps) ps.other = t.value;
  
});

/* ---------- Démarrage ---------- */
$('#demo').remove();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
render();
// Quand elle rouvre l'app après un changement de jour (par exemple le 16), tout se remet à jour avec la date du téléphone.
let lastDay = todayStr();
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  const t = todayStr(); if (t === lastDay) return;
  const wasCurrent = vk === periodOf(lastDay) || vk === curKey();
  lastDay = t; if (wasCurrent) vk = curKey(); render();
});
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
})();
</script>
</body>
</html>
